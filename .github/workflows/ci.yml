name: Checks

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: false
          cache-python: false
      - name: Install
        run: uv sync --locked --no-cache --no-python-downloads
      - name: Test
        run: uv run --locked --no-sync pytest -q -p no:cacheprovider
      - name: Lint
        if: success() || failure()
        run: uv run --locked --no-sync ruff check --no-cache --select F,I,RUF100 main.py src tests
