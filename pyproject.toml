[project]
name = "MshareSift"
version = "0.1.0"
description = "Agent-assisted macro and cross-asset research with public data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx==0.28.1",
]

[dependency-groups]
data = ["polars==1.41.2"]
dev = [
    {include-group = "data"},
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.uv]
package = false
[tool.ruff]
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[project.urls]
Repository = "https://github.com/nostalume/MshareSift"
