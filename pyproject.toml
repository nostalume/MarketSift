[project]
name = "marketsift"
version = "0.1.0"
description = "Continuous market evidence and local queries for agent-led research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx==0.28.1",
    "turbohtml==1.15.4",
]

[project.scripts]
marketsift = "marketsift.cli:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsift"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.16.8",
]

[tool.ruff]
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[project.urls]
Repository = "https://github.com/nostalume/MarketSift"
